name: Erro
description: Relatar um erro reproduzível sem incluir dados de pacientes
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Comportamento observado
      description: Nunca inclua dados clínicos ou credenciais reais.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Passos para reproduzir
      description: Informe plataforma, versão, conexão e dados sintéticos usados.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto em dados e segurança
      description: Descreva perda, duplicação, acesso indevido ou risco clínico, se houver.
